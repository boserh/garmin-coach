[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-bot"
version = "1.0.0"
description = "Garmin → Claude analysis: a Telegram bot + FastAPI web layer over a shared core."
# OPS-10: garminconnect >= 0.3.6 (the post-Cloudflare auth engine) requires >= 3.12.
# The Pi already runs 3.13.5; a dev venv on an older Python must be recreated.
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",  # prod-only: N uvicorn workers under one master, SIGHUP = zero-downtime reload
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "aiosqlite",
    "asyncpg",
    "anthropic",
    "python-telegram-bot[job-queue]",
    # OPS-10: the native (curl_cffi) engine — validated against the live account from
    # the production IP in OPS-01. 0.3.6 is the recon'd floor; 0.2.x authenticated
    # *through* garth and must not be resolved to.
    "garminconnect>=0.3.6",
    "requests",           # app/weather.py talks to Open-Meteo directly (was transitive)
    "python-dotenv",
    "cryptography",       # Fernet encryption of stored credentials
    "bcrypt",             # password hashing for web login
    "itsdangerous",       # signed cookie sessions (starlette SessionMiddleware)
    "python-multipart",   # HTML form parsing (login / settings POST)
    "fitparse",           # parse pace/HR series from FIT files in a Garmin export
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]
mcp = [
    # NF-08: personal read-only MCP server over the DB — opt-in, not a base dep.
    "mcp",
]
garth = [
    # OPS-10 rollback only: reinstates the pre-migration engine. Pair it with
    # GARMIN_PROVIDER=garth — nothing selects garth without that env var.
    # Pinned because 0.8.x's SSO flow gets 429'd by Garmin; 0.4.47 was the one
    # that still slipped past Cloudflare.
    "garth==0.4.47",
]

[tool.setuptools]
packages = ["app", "app.core", "app.db", "app.garmin", "app.analysis", "app.routers", "bot"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # autogenerated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E731"]  # assigned lambdas are intentional in the aggregation code
