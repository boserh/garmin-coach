<!doctype html>
<html lang="uk">
<head>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація — Garmin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=4">
  <script defer src="/static/app.js?v=1"></script>
</head>
<body class="auth">
  <div style="display:flex;flex-direction:column;gap:1rem">
  <form class="authcard" method="post" action="/register">
    <h1 class="brand">Реєстрація</h1>
    <div class="sub">Доступ активується після підтвердження адміністратором.</div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="6" required>
    <button class="btn" type="submit">Зареєструватись</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <div class="alt">Вже є акаунт? <a href="/login">Увійти</a></div>
  </form>
  <form class="authcard" method="post" action="/demo-login">
    <button class="btn btn-ghost" type="submit">Спробувати демо (без реєстрації)</button>
    <div class="sub" style="margin-top:.5rem">Фейкові дані для перегляду — без звернень до Garmin чи Claude.</div>
  </form>
  </div>
</body>
</html>
